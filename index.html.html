<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00383B">
  <title>Bus Simulator Demo</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#00383B; }
    #unity-container.unity-mobile { position:fixed; inset:0; width:100%; height:100%; transform:none; }
    #unity-canvas.unity-mobile { display:block; width:100%; height:100%; }
    .unity-mobile #unity-footer { display:none; }
    #demo-label { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 4px); left:50%; transform:translateX(-50%); z-index:10000; background:#00383B; color:white; font: bold 12px sans-serif; padding:5px 10px; white-space:nowrap; pointer-events:none; }
  </style>
</head>
<body>
  <div id="demo-label">SIMULATOR — NOT VALID FOR TRAVEL</div>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="393" height="852" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Bus Simulator Demo</div>
    </div>
  </div>
  <script>
    var container = document.querySelector('#unity-container');
    var canvas = document.querySelector('#unity-canvas');
    var loadingBar = document.querySelector('#unity-loading-bar');
    var progressBarFull = document.querySelector('#unity-progress-bar-full');
    var fullscreenButton = document.querySelector('#unity-fullscreen-button');
    var warningBanner = document.querySelector('#unity-warning');
    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.textContent = msg;
      warningBanner.appendChild(div);
      warningBanner.style.display = 'block';
      div.style.cssText = 'padding:10px;background:' + (type === 'error' ? 'red' : 'yellow');
      if (type !== 'error') setTimeout(function () {
        div.remove();
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }, 5000);
    }
    var buildUrl = 'Build';
    var loaderUrl = buildUrl + '/BUS WEB.loader.js';
    var config = {
      dataUrl: buildUrl + '/BUS WEB.data',
      frameworkUrl: buildUrl + '/BUS WEB.framework.js',
      codeUrl: buildUrl + '/BUS WEB.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'Bus Ticket',
      productVersion: '1.0.2',
      showBanner: unityShowBanner
    };
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
      container.className = 'unity-mobile';
      canvas.className = 'unity-mobile';
    } else {
      canvas.style.width = '393px';
      canvas.style.height = '852px';
    }
    loadingBar.style.display = 'block';
    var script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + '%';
      }).then(function (unityInstance) {
        loadingBar.style.display = 'none';
        fullscreenButton.onclick = function () { unityInstance.SetFullscreen(1); };
      }).catch(function (message) { alert(message); });
    };
    script.onerror = function () { unityShowBanner('Unity loader could not be loaded.', 'error'); };
    document.body.appendChild(script);
  </script>
</body>
</html>
